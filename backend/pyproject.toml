[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smms-backend"
version = "0.1.0"
description = "Smart Mess Management System - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg2-binary>=2.9.9",
  "bcrypt>=4.1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "cloudinary>=1.40.0",
  "email-validator>=2.1",
  "python-dotenv>=1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.4.0",
  "mypy>=1.10",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
