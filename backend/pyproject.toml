[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "smms-backend"
version = "0.1.0"
description = "Smart Mess Management System API"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.18.5",
  "cloudinary==1.45.0",
  "email-validator==2.3.0",
  "fastapi==0.139.0",
  "psycopg[binary,pool]==3.3.4",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["cloudinary.*"]
ignore_missing_imports = true
